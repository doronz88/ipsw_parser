# This workflow uploads a Python Package to PyPI using Trusted Publishing (OIDC).
# No API tokens or passwords are stored: PyPI verifies the workflow's identity.
# See: https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/ipsw_parser

    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history + tags so setuptools_scm can derive the version
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build
      run: python -m build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
